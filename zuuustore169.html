<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree - Pusat Item & Quest Roblox GAG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Animasi partikel melayang */
        .particle { position: absolute; color: #10b981; pointer-events: none; animation: float 3s ease-in-out infinite; }
        @keyframes float { 
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; } 
            50% { transform: translateY(-10px) rotate(15deg); opacity: 1; } 
        }
        /* Animasi bintang berkelap-kelip */
        .star-sparkle { position: absolute; color: #34d399; pointer-events: none; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Kombinasi Partikel Daun & Bintang Hijau di Sekitar -->
    <i class="fa-solid fa-leaf text-xs particle" style="top: 15%; left: 18%; animation-delay: 0s;"></i>
    <i class="fa-solid fa-star text-xs star-sparkle" style="top: 22% ; left: 80%; animation-delay: 0.3s;"></i>
    <i class="fa-solid fa-star text-sm star-sparkle" style="top: 40%; left: 8%; animation-delay: 0.7s;"></i>
    <i class="fa-solid fa-sparkle text-sm particle" style="top: 25%; left: 82%; animation-delay: 0.8s;"></i>
    <i class="fa-solid fa-leaf text-sm particle" style="top: 75%; left: 12%; animation-delay: 1.2s;"></i>
    <i class="fa-solid fa-star text-xs star-sparkle" style="top: 85%; left: 78%; animation-delay: 0.5s;"></i>
    <i class="fa-solid fa-sparkle text-xs particle" style="top: 80%; left: 88%; animation-delay: 0.4s;"></i>

    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-emerald-500/30 p-6 rounded-3xl text-center shadow-2xl shadow-emerald-950/50 z-10">
        
        <!-- Avatar Ikon Topi (Witch Hat) -->
        <div class="relative w-24 h-24 mx-auto mb-4 flex items-center justify-center">
            <div class="w-full h-full bg-gradient-to-br from-emerald-700 to-emerald-900 rounded-full flex items-center justify-center text-4xl text-emerald-300 shadow-lg shadow-emerald-900/50 border-4 border-emerald-500/30">
                <i class="fa-solid fa-hat-wizard"></i>
            </div>
            <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center border-4 border-slate-900 shadow-sm">
                <span class="text-[8px] font-bold text-slate-900">Z</span>
            </div>
        </div>

        <h1 class="text-2xl font-extrabold tracking-tight mb-1 text-white">ZuuStoree</h1>
        <p class="text-xs text-emerald-300 font-medium mb-6">Pusat Item & Quest Roblox GAG2 Terpercaya</p>
        
        <!-- Daftar Produk -->
        <div class="space-y-3 mb-6 text-left text-xs bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
            <div class="flex justify-between items-center py-1">
                <span class="font-medium text-slate-300"><i class="fa-solid fa-box-open text-emerald-400 mr-2"></i>Item Roblox</span>
                <span class="font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg">Rp 1rb - 50rb</span>
            </div>

            <div class="pt-3 mt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span>Pembayaran DANA:</span>
                <strong class="text-white bg-slate-900 px-2 py-0.5 rounded border border-slate-800">0822-5685-2654</strong>
            </div>
        </div>

        <!-- Tombol QR & TESTI -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <a href="https://wa.me/6282256852654?text=Halo%20ZuuStoree,%20saya%20mau%20minta%20QR" target="_blank" class="py-3 bg-slate-950/80 hover:bg-emerald-950 border border-emerald-500/30 text-emerald-400 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode"></i> QR ON
            </a>
            <a href="https://wa.me/6282256852654?text=Halo%20ZuuStoree,%20saya%20mau%20lihat%20testimoni" target="_blank" class="py-3 bg-slate-950/80 hover:bg-emerald-950 border border-emerald-500/30 text-emerald-400 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-star"></i> TESTI ON
            </a>
        </div>

        <!-- Tombol Aksi WhatsApp -->
        <a href="https://wa.me/6282256852654?text=Halo%20ZuuStoree,%20saya%20mau%20order" target="_blank" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
            <i class="fa-brands fa-whatsapp text-base"></i> Order ke WA Sekarang
        </a>
        
        <p class="text-[10px] text-slate-500 mt-5">© 2026 ZuuStoree. Fast, Safe & Trusted.</p>
    </div>
</body>
</html>
