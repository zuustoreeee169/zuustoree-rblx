<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree - Pusat Item & Quest Roblox GAG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .spinner-ring { border: 3px solid transparent; border-top-color: #10b981; border-bottom-color: #047857; border-radius: 50%; animation: putarRing 1.2s linear infinite; }
        @keyframes putarRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-dot { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .interactive-btn:hover { transform: scale(1.02); }
        .preload-hidden { opacity: 0 !important; visibility: hidden !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-950 text-slate-100 min-h-screen p-4 flex items-center justify-center">

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center transition-all duration-500">
        <div class="w-16 h-16 spinner-ring mb-4"></div>
        <div class="text-white font-bold text-xl">ZuuStoree</div>
    </div>

    <!-- KOTAK UTAMA -->
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-emerald-500/30 p-6 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-emerald-700 to-emerald-900 rounded-full flex items-center justify-center border-4 border-emerald-500/30 mb-3">
                <i class="fa-solid fa-hat-wizard text-3xl text-emerald-300"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">ZuuStoree</h1>
            <p class="text-xs text-emerald-300 font-medium">Pusat Item & Quest Roblox GAG2</p>
            
            <!-- STATUS TOKO -->
            <div id="statusBadge" class="mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-bold border">
                <span id="statusDot" class="w-2 h-2 rounded-full"></span>
                <span id="statusText">Memuat...</span>
            </div>
        </div>

        <!-- FORM ORDER -->
        <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800 mb-5">
            <h2 class="text-[10px] font-bold text-emerald-400 mb-3 uppercase tracking-widest text-center">Form Order</h2>
            <div class="space-y-3">
                <input type="text" id="username" placeholder="Username Akun: (contoh zuuuuu)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:border-emerald-500 outline-none">
                <input type="text" id="order" placeholder="Order: (contoh Joki AFK 1 Hari)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:border-emerald-500 outline-none">
                <button onclick="kirimOrder()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp"></i> Kirim Pesanan ke Admin
                </button>
            </div>
        </div>

        <!-- INFO LAINNYA -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="openQRModal()" class="py-3 bg-slate-950 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold rounded-xl hover:bg-emerald-950 transition">LIHAT QRIS</button>
            <a href="https://whatsapp.com/channel/0029VbCJDxD1XquYKVRvqp1K" target="_blank" class="py-3 bg-slate-950 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold rounded-xl flex items-center justify-center hover:bg-emerald-950 transition">TESTIMONI</a>
        </div>

        <!-- SOSIAL MEDIA -->
        <div class="text-center">
            <p class="text-[10px] text-slate-500 mb-2">Ikuti kami di TikTok</p>
            <a href="https://www.tiktok.com/@zuu_zv16" target="_blank" class="inline-flex items-center gap-2 text-emerald-400 font-bold text-xs hover:text-emerald-300">
                <i class="fa-brands fa-tiktok"></i> @zuu_zv16
            </a>
        </div>
    </div>

    <!-- MODAL QRIS -->
    <div id="qrModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 p-4 rounded-3xl max-w-xs w-full text-center border border-emerald-500/30">
            <img src="223165.jpg" class="w-full rounded-2xl mb-4">
            <button onclick="closeQRModal()" class="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Tutup</button>
        </div>
    </div>

    <script>
        // STATUS OTOMATIS
        function cekStatus() {
            const now = new Date();
            const jam = now.getHours();
            const isBuka = jam >= 5 && jam < 21;
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if(isBuka) {
                badge.className = "mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-bold border bg-emerald-950/60 border-emerald-500/40 text-emerald-400";
                dot.className = "w-2 h-2 rounded-full status-dot bg-emerald-400";
                text.innerText = "TOKO BUKA (05:00 - 21:00 WIB)";
            } else {
                badge.className = "mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-bold border bg-rose-950/60 border-rose-500/40 text-rose-400";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.innerText = "TOKO TUTUP (Buka 05:00 WIB)";
            }
        }

        // KIRIM PESAN WA
        function kirimOrder() {
            const user = document.getElementById('username').value;
            const ord = document.getElementById('order').value;
            if(!user || !ord) { alert("Harap isi Username dan Order!"); return; }
            const pesan = `Halo Admin ZuuStoree, saya mau order:%0A%0A*Username Akun:* ${user}%0A*Order:* ${ord}%0A%0ATolong diproses ya min!`;
            window.open(`https://wa.me/6282256852654?text=${pesan}`, '_blank');
        }

        function openQRModal() { document.getElementById('qrModal').classList.remove('hidden'); }
        function closeQRModal() { document.getElementById('qrModal').classList.add('hidden'); }
        
        window.onload = () => { cekStatus(); setTimeout(() => document.getElementById('preloader').classList.add('preload-hidden'), 1000); }
    </script>
</body>
</html>
