<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree - Pusat Item & Quest Roblox GAG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- TEMPAT MELETAKKAN KODE CSS (DI DALAM <style>) -->
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Preloader Kilat Hitam */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 0.5s ease-in-out 1.5s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .flash-text {
            color: #10b981; /* Warna emerald */
            font-weight: 800;
            font-size: 2rem;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        /* Akhir Animasi Preloader */

        .particle { position: absolute; color: #10b981; pointer-events: none; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; } 50% { transform: translateY(-15px) rotate(20deg); opacity: 1; } }
        .star-sparkle { position: absolute; color: #34d399; pointer-events: none; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.1; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.3); } }
        .interactive-btn { transition: all 0.2s ease-in-out; }
        .interactive-btn:hover { transform: scale(1.03); }
        .interactive-btn:active { transform: scale(0.97); }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); } 50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.8); } }
        .pulse-main { animation: pulse-glow 2s infinite; }

        /* Animasi Fade-In saat Halaman Dibuka */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }

        /* Animasi Gelombang Tombol Melayang WA */
        @keyframes wa-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .floating-wa { animation: wa-bounce 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- PRELOADER KILAT HITAM (HARUS DI BAWAH <body>) -->
    <div id="preloader">
        <div class="flash-text">ZuuStoree</div>
    </div>

    <!-- Audio Latar Musik -->
    <audio id="bgMusic" loop>
        <source src="https://commondatastorage.googleapis.com/codesign-playground-bucket/lofi-study.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Tombol Musik -->
    <button onclick="toggleMusic()" id="musicBtn" class="absolute top-4 right-4 z-30 bg-emerald-900/80 border border-emerald-500/40 text-emerald-300 px-3 py-2 rounded-full text-xs font-bold backdrop-blur-md shadow-lg flex items-center gap-2 interactive-btn">
        <i class="fa-solid fa-music" id="musicIcon"></i> <span id="musicText">Musik: Off</span>
    </button>
