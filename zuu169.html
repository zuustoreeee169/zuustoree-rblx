<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree - Pusat Item & Quest Roblox GAG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Preloader Hitam */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 0.8s ease-in-out 1s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        .flash-text {
            color: #10b981;
            font-weight: 800;
            font-size: 2rem;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .floating-wa { animation: wa-bounce 2.5s infinite ease-in-out; }
        @keyframes wa-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .interactive-btn:hover { transform: scale(1.03); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Preloader -->
    <div id="preloader">
        <div class="flash-text">ZuuStoree</div>
    </div>

    <!-- Konten Utama -->
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-emerald-500/30 p-6 rounded-3xl text-center shadow-2xl z-10 fade-in">
        <div class="relative w-24 h-24 mx-auto mb-4 mt-6 flex items-center justify-center">
            <div class="w-full h-full bg-gradient-to-br from-emerald-700 to-emerald-900 rounded-full flex items-center justify-center text-4xl text-emerald-300 border-4 border-emerald-500/30">
                <i class="fa-solid fa-hat-wizard"></i>
            </div>
        </div>

        <h1 class="text-2xl font-extrabold text-white">ZuuStoree</h1>
        <p class="text-xs text-emerald-300 mb-6">Pusat Item & Quest Roblox GAG2</p>
        
        <div class="space-y-3 mb-6 text-left text-xs bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
            <div class="flex justify-between items-center py-1">
                <span class="font-medium text-slate-300">Roblox Item</span>
                <span class="font-bold text-emerald-400">Rp 1rb - 50rb</span>
            </div>
        </div>

        <a href="https://wa.me/6282256852654?text=Halo%20ZuuStoree" target="_blank" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 interactive-btn">
            <i class="fa-brands fa-whatsapp"></i> Order Sekarang
        </a>
    </div>

    <!-- Tombol WA Melayang -->
    <a href="https://wa.me/6282256852654" target="_blank" class="fixed bottom-5 right-5 z-40 bg-emerald-500 text-slate-950 w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg floating-wa interactive-btn">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

</body>
</html>
