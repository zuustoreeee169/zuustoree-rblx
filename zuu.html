<head>
    <style>
        /* CSS Tambahan untuk Animasi Preloader yang Mewah */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: fadeOutPreloader 0.8s ease-in-out 1.8s forwards;
        }

        .preloader-text {
            color: #10b981; font-weight: 800; font-size: 2.5rem;
            position: relative; animation: textEntrance 1s ease-out forwards;
        }

        /* Efek Glitch */
        .preloader-text::before {
            content: "ZuuStoree"; position: absolute; top: 0; left: -3px;
            color: #fff; opacity: 0.7; animation: glitch 1.5s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); } 100% { transform: translate(0); }
        }

        /* Loading Bar */
        .loading-container { width: 150px; height: 3px; background: #1e293b; border-radius: 2px; margin-top: 20px; overflow: hidden; }
        .loading-bar { height: 100%; background: #10b981; width: 0%; animation: load 1.5s ease-in-out forwards; }
        
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes fadeOutPreloader { to { opacity: 0; visibility: hidden; } }
        @keyframes textEntrance { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body>
    <!-- PRELOADER -->
    <div id="preloader">
        <div class="preloader-text">ZuuStoree</div>
        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>
    </div>
    
    <!-- Sisanya konten website kamu... -->
</body>
