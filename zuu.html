<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS PRELOADER & LOADING BAR */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: hilangkanLayar 0.5s ease-in-out 2.5s forwards;
        }

        .teks-logo { color: #10b981; font-size: 2.5rem; font-weight: 800; }

        .loading-track {
            width: 200px; height: 4px; background: #333;
            margin-top: 20px; border-radius: 10px; overflow: hidden;
        }

        .loading-fill {
            height: 100%; background: #10b981;
            width: 0%;
            animation: jalanBar 2s ease-in-out forwards;
        }

        @keyframes jalanBar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes hilangkanLayar { to { opacity: 0; visibility: hidden; } }

        /* Konten Utama */
        .konten-utama { animation: muncul 1s ease-in-out 2.5s forwards; opacity: 0; }
        @keyframes muncul { to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

    <!-- PRELOADER DENGAN BAR LOADING -->
    <div id="preloader">
        <div class="teks-logo">ZuuStoree</div>
        <div class="loading-track">
            <div class="loading-fill"></div>
        </div>
    </div>

    <!-- KONTEN WEBSITE -->
    <div class="konten-utama text-center p-6 bg-slate-900 rounded-3xl border border-emerald-500/30">
        <h1 class="text-3xl font-bold text-emerald-400 mb-4">ZuuStoree</h1>
        <p class="text-slate-300">Selamat datang di toko kami!</p>
        <a href="https://wa.me/6282256852654" class="mt-6 block py-3 px-6 bg-emerald-600 rounded-xl font-bold">Order Sekarang</a>
    </div>

</body>
</html>
